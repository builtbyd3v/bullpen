<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760">
<style>
text{font-family:Inter,'DejaVu Sans',sans-serif}
.h{font-size:18px;font-weight:500;fill:#1F2937}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px}
.tag{font-size:16px;font-weight:500;fill:#1F2937}
.k{fill:#712B13}.ks{fill:#993C1D}
.g{fill:#085041}.gs{fill:#0F6E56}
.n{fill:#444441}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="760" fill="#ffffff"/>
<text class="h" x="340" y="32" text-anchor="middle">AI agents write faster than git can keep them apart</text>

<rect x="30" y="52" width="620" height="150" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text class="th k" x="50" y="76">Without Bullpen: git, built for humans</text>
<g><rect x="50" y="94" width="80" height="26" rx="13" fill="#ffffff" stroke="#993C1D" stroke-width="0.75"/><text class="ts ks" x="90" y="111" text-anchor="middle">api agent</text></g>
<g><rect x="50" y="128" width="80" height="26" rx="13" fill="#ffffff" stroke="#993C1D" stroke-width="0.75"/><text class="ts ks" x="90" y="145" text-anchor="middle">web agent</text></g>
<g><rect x="50" y="162" width="80" height="26" rx="13" fill="#ffffff" stroke="#993C1D" stroke-width="0.75"/><text class="ts ks" x="90" y="179" text-anchor="middle">db agent</text></g>
<line x1="130" y1="107" x2="236" y2="130" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ac)"/>
<line x1="130" y1="141" x2="236" y2="141" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ac)"/>
<line x1="130" y1="175" x2="236" y2="152" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ac)"/>
<rect x="238" y="114" width="160" height="54" rx="8" fill="#ffffff" stroke="#993C1D" stroke-width="0.75"/>
<text class="th k" x="318" y="133" text-anchor="middle" dominant-baseline="central">One shared file</text>
<text class="ts ks" x="318" y="152" text-anchor="middle" dominant-baseline="central">Everyone writes at once</text>
<line x1="398" y1="141" x2="426" y2="141" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ac)"/>
<rect x="428" y="110" width="202" height="62" rx="8" fill="#ffffff" stroke="#993C1D" stroke-width="1.5"/>
<text class="th k" x="529" y="131" text-anchor="middle" dominant-baseline="central">2 of 10 edits lost</text>
<text class="ts ks" x="529" y="152" text-anchor="middle" dominant-baseline="central">Silently, with no history</text>


<text class="th n" x="50" y="236">When is a collision found?</text>
<rect x="120" y="246" width="170" height="24" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text class="ts gs" x="205" y="262" text-anchor="middle" style="font-weight:500">Bullpen: caught here</text>
<line x1="205" y1="270" x2="205" y2="281" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<rect x="530" y="246" width="120" height="24" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text class="ts ks" x="590" y="262" text-anchor="middle" style="font-weight:500">Git: found here</text>
<path d="M600 270 L600 276 L610 276 L610 281" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#ac)"/>
<line x1="70" y1="290" x2="610" y2="290" stroke="#B4B2A9" stroke-width="2"/>
<circle cx="70" cy="290" r="5" fill="#ffffff" stroke="#888780" stroke-width="1.5"/>
<circle cx="205" cy="290" r="7" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="340" cy="290" r="5" fill="#ffffff" stroke="#888780" stroke-width="1.5"/>
<circle cx="475" cy="290" r="5" fill="#ffffff" stroke="#888780" stroke-width="1.5"/>
<circle cx="610" cy="290" r="7" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.5"/>
<text class="ts n" x="70" y="312" text-anchor="middle">Task starts</text>
<text class="ts n" x="205" y="312" text-anchor="middle">Edit</text>
<text class="ts n" x="340" y="312" text-anchor="middle">Commit</text>
<text class="ts n" x="475" y="312" text-anchor="middle">Pull request</text>
<text class="ts n" x="610" y="312" text-anchor="middle">Merge</text>
<text class="ts gs" x="205" y="330" text-anchor="middle">Before the code is written</text>
<text class="ts ks" x="566" y="330" text-anchor="middle">Each PR looked clean alone</text>
<g transform="translate(0,130)">
<rect x="30" y="222" width="620" height="326" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th g" x="50" y="246">With Bullpen: version control for agents</text>
<g><rect x="50" y="280" width="80" height="26" rx="13" fill="#ffffff" stroke="#0F6E56" stroke-width="0.75"/><text class="ts gs" x="90" y="297" text-anchor="middle">api agent</text></g>
<g><rect x="50" y="314" width="80" height="26" rx="13" fill="#ffffff" stroke="#0F6E56" stroke-width="0.75"/><text class="ts gs" x="90" y="331" text-anchor="middle">web agent</text></g>
<g><rect x="50" y="348" width="80" height="26" rx="13" fill="#ffffff" stroke="#0F6E56" stroke-width="0.75"/><text class="ts gs" x="90" y="365" text-anchor="middle">db agent</text></g>
<line x1="130" y1="293" x2="186" y2="310" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<line x1="130" y1="327" x2="186" y2="327" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<line x1="130" y1="361" x2="186" y2="344" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<rect x="188" y="266" width="220" height="122" rx="10" fill="#ffffff" stroke="#0F6E56" stroke-width="2"/>
<text class="th g" x="298" y="290" text-anchor="middle" dominant-baseline="central">The lease desk</text>
<text class="ts gs" x="298" y="314" text-anchor="middle" dominant-baseline="central">One agent per file</text>
<text class="ts gs" x="298" y="332" text-anchor="middle" dominant-baseline="central">No two branches touch one file</text>
<text class="ts gs" x="298" y="350" text-anchor="middle" dominant-baseline="central">Stale copies auto-updated</text>
<text class="ts gs" x="298" y="368" text-anchor="middle" dominant-baseline="central">Guarded folders ask a human</text>
<line x1="408" y1="296" x2="426" y2="296" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<rect x="428" y="270" width="202" height="52" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th g" x="529" y="288" text-anchor="middle" dominant-baseline="central">Own branch per agent</text>
<text class="ts gs" x="529" y="307" text-anchor="middle" dominant-baseline="central">Every edit committed: who + why</text>
<rect x="428" y="338" width="202" height="52" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th g" x="529" y="356" text-anchor="middle" dominant-baseline="central">Undo: throw it away</text>
<text class="ts gs" x="529" y="375" text-anchor="middle" dominant-baseline="central">Only its work rolls back</text>
<text class="ts gs" x="529" y="402" text-anchor="middle" style="font-weight:500">or</text>
<path d="M630 296 L641 296 L641 364 L634 364" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<path d="M641 364 L641 432 L634 432" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<rect x="428" y="406" width="202" height="52" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th g" x="529" y="424" text-anchor="middle" dominant-baseline="central">Merge: keep it in main</text>
<text class="ts gs" x="529" y="443" text-anchor="middle" dominant-baseline="central">Then every branch syncs</text>

<text class="ts gs" x="50" y="460">Every edit, every time (lease renews while the agent works):</text>
<g>
<rect x="50" y="472" width="70" height="36" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="0.75"/><text class="th g" x="85" y="494" text-anchor="middle">Ask</text>
<rect x="138" y="472" width="100" height="36" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.5"/><text class="th g" x="188" y="494" text-anchor="middle">Lease 90 s</text>
<rect x="256" y="472" width="76" height="36" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="0.75"/><text class="th g" x="294" y="494" text-anchor="middle">Write</text>
<rect x="350" y="472" width="110" height="36" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="0.75"/><text class="th g" x="405" y="494" text-anchor="middle">Auto-commit</text>
<rect x="478" y="472" width="150" height="36" rx="8" fill="#ffffff" stroke="#0F6E56" stroke-width="0.75"/><text class="th g" x="553" y="494" text-anchor="middle">Release when done</text>
</g>
<line x1="120" y1="490" x2="136" y2="490" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<line x1="238" y1="490" x2="254" y2="490" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<line x1="332" y1="490" x2="348" y2="490" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<line x1="460" y1="490" x2="476" y2="490" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#at)"/>
<text class="ts gs" x="50" y="530">Rules live on a separate Jetson the agents can't change. Unplug it and every edit stops.</text>

</g>
<text class="tag" x="340" y="714" text-anchor="middle">Git was built for humans. Bullpen is version control for agents.</text>
<text class="ts n" x="340" y="738" text-anchor="middle">Your sub writes the code. The Jetson keeps it honest, free, and private.</text>
</svg>
