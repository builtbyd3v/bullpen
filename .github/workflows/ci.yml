name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      server: ${{ steps.filter.outputs.server }}
      jetson: ${{ steps.filter.outputs.jetson }}
      hooks: ${{ steps.filter.outputs.hooks }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/**'
            server:
              - 'server/**'
              - '.github/workflows/**'
            jetson:
              - 'jetson/**'
              - '.github/workflows/**'
            hooks:
              - 'hooks/**'
              - '.github/workflows/**'

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  server:
    name: server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
      - run: uvx ruff@0.17.6 check --select E9,F .
      - run: uv run python -c "import main"

  jetson:
    name: jetson
    needs: changes
    if: needs.changes.outputs.jetson == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetson
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: jetson/uv.lock
      - run: uv sync --locked
      - run: uvx ruff@0.17.6 check --select E9,F .
      - run: uv run python -c "import main"

  hooks:
    name: hooks
    needs: changes
    if: needs.changes.outputs.hooks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uvx ruff@0.17.6 check --select E9,F hooks
      - run: python3 -m py_compile hooks/bullpen_hook.py

  ci-ok:
    name: ci-ok
    needs: [changes, web, server, jetson, hooks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed or were skipped."
